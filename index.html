}

/* ---------- апгрейдер ---------- */

  <div class="up"><div class="col"><div class="panel"><b>Твои предметы</b> <span id="selInfo" class="sub"></span>

    <div class="ringbox panel" id="ringBox"></div></div>
  <div class="col"><div class="panel"><b>Цель</b><div class="tools" style="margin:8px 0"><input type="search" id="tq" placeholder="Найти цель" value="${q.replace(/"/g,"&quot;")}"></div>
    <div class="quick" id="quick">${[2,3,5,10,25,100].map(m=>`<button class="btn" data-m="${m}">×${m}</button>`).join("")}</div>
    <div class="scroll grid" id="tgt" style="margin-top:10px"></div></div></div></div>`;
  renderTargets();renderRing(0);
}
function renderTargets(){
  const V=selVal(),box=$("#tgt");if(!box)return;

  const si=$("#selInfo");if(si)si.textContent=sel.size?`· выбрано ${sel.size} на ${fmt(V)}`:"";

function renderRing(ang){

function doUpgrade(){
  if(busy||!canGo())return;
  busy=true;const V=selVal(),T=ITEMS[target],ch=chanceOf(V,T.v);
  const ids=[...sel];S.inv=S.inv.filter(x=>!sel.has(x.uid));sel.clear();
  const A=ch*360,won=Math.random()<ch,reg=won?[0,A]:[A,360];
  let landing;
  landing=reg[0]+Math.random()*(reg[1]-reg[0]);

  if(won){uid=S.uid++;S.inv.push({uid,id:T.id});S.upW++}else{
    S.upL++;

  void ptr.offsetWidth;ptr.style.transform=`rotate(${rot}deg)`;
  SND.click();if(!fast)for(let i=0;i<30;i++)setTimeout(SND.tick,(dur-200)*(1-Math.pow(1-i/30,1.8)));

  },fast?200:dur+150);
}

      if(Math.hypot(n.g.position.x-c.x,n.g.position.z-c.z)<3.2)c.v*=1-3*dt}
    g.position.set(c.x,.1,c.z);g.rotation.y=c.a;g.rotation.z=-sv*.04*Math.min(1,ab/top*2);
    const d=rc?4.5:9,h=rc?2.2:5;cp.set(c.x-Math.sin(c.a)*d,h,c.z-Math.cos(c.a)*d);cam.position.lerp(cp,1-Math.pow(.002,dt));
    cam.lookAt(c.x+Math.sin(c.a)*4,1.2,c.z+Math.cos(c.a)*4);cam.fov=65+ab/top*14;cam.updateProjectionMatrix();
    sp.textContent=Math.round(ab*3.6)+' км/ч';R.render(sc,cam);
  })(last);
}

/* ---------- роутинг ---------- */
function render(){head();({cases:viewCases,drive:viewDrive,upg:viewUp,inv:viewInv,cat:viewCat})[tab]()}
function restoreFocus(id,pos){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){if(busy)return;tab=t.dataset.tab;openCase=null;q="";rf="all";catSel=null;catLimit=120;render();return}
  const cs=e.target.closest(".case");if(cs&&!busy){openCase=+cs.dataset.c;render();return}
  if(e.target.id==="back"&&!busy){openCase=null;render();return}
  if(e.target.id==="openBtn"){openOne();return}
  const sl=e.target.closest("[data-sell]");
  if(e.target.id==="snd"){muted=!muted;try{localStorage.setItem("vd-mute",muted?"1":"0")}catch(_){}$("#snd").textContent=muted?"Звук: выкл":"Звук: вкл";SND.click();return}
  if(e.target.id==="revClose"||e.target.id==="reveal"){$("#reveal").hidden=true;return}
  if(sl){sell(sl.dataset.sell.split(",").map(Number));sl.disabled=true;sl.textContent="Продано";if(sl.id==="revSell")$("#reveal").hidden=true;return}
  const qb=e.target.closest("[data-qty]");
  if(qb&&!busy){qty=+qb.dataset.qty;document.querySelectorAll("#qty .btn").forEach(b=>b.classList.toggle("pri",+b.dataset.qty===qty));const c=CASES[openCase],ob=$("#openBtn");ob.textContent=openLabel(c);ob.disabled=S.bal<c.price*qty;return}
  if(e.target.id==="goBtn"){doUpgrade();return}
  if(e.target.id==="selAll"){invItems().filter(i=>(rf==="all"||i.t==rf)&&(!q||(i.model+" "+i.vr).toLowerCase().includes(q.toLowerCase()))).forEach(i=>sel.add(i.uid));viewInv();return}
  if(e.target.id==="more"){catLimit+=120;viewCat();return}
  if(e.target.id==="selJunk"){invItems().filter(i=>i.t===0).forEach(i=>sel.add(i.uid));viewInv();return}
  if(e.target.id==="selNone"){sel.clear();viewInv();return}
  if(e.target.id==="sellSel"){sell([...sel]);viewInv();return}
  if(e.target.id==="toUp"){tab="upg";q="";render();return}
  const m=e.target.closest("[data-m]");
  if(m){const V=selVal();if(!V)return toast("Сначала выбери свои предметы");
    const want=V*+m.dataset.m;let best=null;
    for(const it of ITEMS){if(it.v>V&&(best==null||Math.abs(it.v-want)<Math.abs(best.v-want)))best=it}
    if(!best)return toast("Целей выше нет");target=best.id;renderTargets();renderRing();return}
  const it=e.target.closest(".it[data-uid]");
  if(it&&!busy&&(tab==="inv"||tab==="upg")){
    const u=+it.dataset.uid;sel.has(u)?sel.delete(u):sel.add(u);
    if(tab==="inv")viewInv();else{if(target!=null&&ITEMS[target].v<=selVal())target=null;it.classList.toggle("sel",sel.has(u));renderTargets();renderRing()}
    return}
  if(e.target.id==="buyBtn"){buyItem();return}
  if(e.target.id==="buyX"){catSel=null;document.querySelectorAll(".it.sel").forEach(x=>x.classList.remove("sel"));renderBuy();return}
  const tg=e.target.closest(".it[data-id]");
  if(tg&&tab==="cat"){catSel=+tg.dataset.id;document.querySelectorAll(".it.sel").forEach(x=>x.classList.remove("sel"));tg.classList.add("sel");renderBuy();return}
  if(tg&&tab==="upg"&&!busy){target=+tg.dataset.id;renderTargets();renderRing();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const r=$("#reveal");if(r&&!r.hidden){r.hidden=true;return}}if((e.key==="Enter"||e.key===" ")&&e.target.matches(".it[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="q"){catLimit=120;q=e.target.value;const p=e.target.selectionStart;tab==="inv"?viewInv():viewCat();restoreFocus("q",p)}
  else if(id==="tq"){q=e.target.value;renderTargets()}
  else if(id==="rf"){rf=e.target.value;tab==="inv"?viewInv():viewCat()}
  else if(id==="sb"){sortBy=e.target.value;tab==="inv"?viewInv():viewCat()}
});
let rs=false;
$("#reset").addEventListener("click",e=>{
  if(!rs){rs=true;e.target.textContent="Точно? Нажми ещё раз";setTimeout(()=>{rs=false;e.target.textContent="Начать заново"},3000);return}
  S={bal:1000,sec:0,uid:1,inv:[],opened:0,upW:0,upL:0,gift:1,gift2:1,gift3:1};sel.clear();target=null;openCase=null;save();rs=false;e.target.textContent="Начать заново";render();toast("Игра сброшена, баланс $1 000");
});
render();
addEventListener("pagehide",save);
if(giftNow)toast("Подарок: +"+fmt(giftSum)+" на баланс");
})();
</script>
